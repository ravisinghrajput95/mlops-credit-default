name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact version, unlike every other action here: setup-uv publishes no
        # floating major tag, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock is stale, so a dependency change that was not
        # committed cannot pass CI.
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check src tests scripts flows

      - name: Check formatting
        run: uv run ruff format --check src tests scripts flows

      - name: Type check
        run: uv run mypy

      - name: Test
        # The suite is hermetic: it builds its own synthetic frames and never
        # touches the network or a live MLflow server.
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  data-contract:
    name: Data contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-extras --frozen

      - name: Validate the real dataset against the schema
        # This job hits the live UCI archive on purpose: it is what catches the
        # upstream file changing shape, which unit tests on synthetic data cannot.
        run: |
          uv run python -m credit_default.data.ingest
          uv run python -m credit_default.data.split

  image:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: credit-default-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # GitHub runners use the containerd image store, where an image built
          # with provenance/SBOM attestations loads as a manifest list. `docker
          # image inspect` then sums every manifest in that list, which reported
          # this image as 908 MB when it is actually 294 MB. The attestations are
          # not used here, so they are turned off.
          provenance: false
          sbom: false

      - name: Image must stay inside Artifact Registry's free tier
        # Measured compressed, because that is what a registry stores and bills.
        #
        # `docker image inspect --format {{.Size}}` is NOT portable for this:
        # Docker Desktop's containerd snapshotter reports compressed sizes while
        # the classic overlay2 store on CI reports uncompressed ones. The same
        # image read as 253 MB locally and 799 MB here, which sent an earlier
        # version of this gate chasing bloat that did not exist.
        run: |
          BYTES=$(docker save credit-default-api:ci | gzip -6 | wc -c)
          MB=$((BYTES / 1024 / 1024))
          echo "Compressed image size: ${MB} MB (budget 400 MB, free tier 500 MB)"
          echo "| Compressed image | ${MB} MB / 400 MB |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MB" -gt 400 ]; then
            echo "::error::Image is ${MB} MB compressed, over the 400 MB budget."
            echo "Largest packages in the runtime venv:"
            docker run --rm --entrypoint sh credit-default-api:ci -c \
              "du -sm /app/.venv/lib/python3.12/site-packages/* 2>/dev/null | sort -rn | head -15"
            exit 1
          fi

      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 -e MODEL_SOURCE=local credit-default-api:ci
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          # No model is baked in, so degraded is the correct answer here; what is
          # being tested is that the container boots and serves at all.
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status"'
          docker rm -f api
