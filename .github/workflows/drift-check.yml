name: Drift check

on:
  schedule:
    # 06:00 UTC on Mondays. Weekly matches how fast a credit population actually
    # moves; hourly would only generate noise.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Inject synthetic drift first, to demonstrate the alert"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Compare current data against the training reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-extras --frozen

      - name: Rebuild the cohorts
        run: |
          uv run python -m credit_default.data.ingest
          uv run python -m credit_default.data.split

      - name: Inject synthetic drift
        if: inputs.simulate
        run: uv run python scripts/simulate_drift.py

      - name: Check for drift
        id: drift
        run: uv run python -m credit_default.monitoring.drift --fail-on-drift

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/
          retention-days: 30

      - name: Open an issue when drift is detected
        if: failure() && steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('reports/drift_summary.json', 'utf8'));
            const drifted = Object.entries(s.columns)
              .filter(([, v]) => v.drifted)
              .sort((a, b) => b[1].score - a[1].score)
              .map(([n, v]) => `| \`${n}\` | ${v.score} | ${v.threshold} | ${v.method} |`)
              .join('\n');

            const body = [
              `Drift was detected in **${s.drifted_columns} of ${s.monitored_columns}** monitored columns`,
              `(share ${s.drifted_share}, threshold ${s.threshold}).`,
              '',
              '| Column | Score | Threshold | Method |',
              '| --- | --- | --- | --- |',
              drifted,
              '',
              `Reference rows: ${s.reference_rows} · Current rows: ${s.current_rows}`,
              '',
              'The full Evidently report is attached to the workflow run as the',
              '`drift-report` artifact.',
              '',
              '**This does not automatically retrain or promote anything.** Review the',
              'report, then run the training pipeline if the shift is real.',
              '',
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data drift detected (${s.drifted_columns}/${s.monitored_columns} columns)`,
              labels: ['drift', 'monitoring'],
              body,
            });
