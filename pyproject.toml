[project]
name = "credit-default"
version = "0.1.0"
description = "End-to-end MLOps pipeline for credit default prediction"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Runtime deps shared by every entrypoint (API, training, flows).
# Deliberately minimal so the serving image stays small.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyarrow>=17.0",
    "pandera>=0.32",
]

[project.optional-dependencies]
# Model training. Not installed into the API image.
train = [
    "scikit-learn>=1.6",
    # xgboost-cpu, not xgboost: the default wheel bundles ~290 MB of CUDA
    # libraries that nothing here uses. Training on this dataset is CPU-bound.
    "xgboost-cpu>=2.1",
    "mlflow>=2.19",
    "matplotlib>=3.9",
    "xlrd>=2.0",           # UCI ships the dataset as legacy .xls
    "requests>=2.32",
]

# Inference API. This set defines the production image, so it is kept lean:
# mlflow-skinny gives the model loader and registry client without the tracking
# server, Flask and Alembic that full mlflow drags in. That difference is what
# keeps the image inside Artifact Registry's 0.5 GB always-free tier.
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "scikit-learn>=1.6",   # needed to deserialise the model pipeline
    "xgboost-cpu>=2.1",    # see the train extra: no CUDA payload
    "mlflow-skinny>=3.0",  # model loading + registry client, no server
    "skops>=0.11",         # the serialisation format mlflow 3 defaults to
    "prometheus-fastapi-instrumentator>=7.0",
    "psycopg[binary]>=3.2",
    "gcsfs>=2024.10",
]

# Drift reporting and monitoring jobs.
monitor = [
    "evidently>=0.7",
    "scikit-learn>=1.6",
    "psycopg[binary]>=3.2",
    "gcsfs>=2024.10",
]

# Pipeline orchestration + data versioning.
orchestrate = [
    "prefect>=3.1",
    "dvc[gs]>=3.56",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx2>=2.12",        # FastAPI TestClient transport (httpx is deprecated by starlette)
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_default"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "PTH",      # prefer pathlib
    "RUF",
]
ignore = [
    "E501",     # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.12"
packages = ["credit_default"]
mypy_path = "src"
strict = true
# Most of the ML/data ecosystem ships incomplete or absent stubs; typing our own
# code strictly is the point, not fighting third-party annotations.
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires the docker-compose stack to be running",
]
filterwarnings = [
    "error::DeprecationWarning:credit_default.*",
    # Evidently vendors legacy numpy calls we do not control.
    "ignore::DeprecationWarning:evidently.*",
    "ignore::DeprecationWarning:numpy.*",
    "ignore:numpy.core is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/credit_default"]
branch = true
